[package]
name = "launchvault"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6.0.0"
eframe = { version = "0.36.1", features = ["default"] }
egui_extras = { version = "0.36.1", features = ["image"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.4.0"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
