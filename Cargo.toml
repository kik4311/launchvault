[package]
name = "launchvault"
version = "0.1.0"
edition = "2024"
description = "Персональный игровой центр для Linux и Windows"
license = "GPL-3.0"
repository = "https://github.com/kik4311/launchvault"
homepage = "https://github.com/kik4311/launchvault"
readme = "README.md"
categories = ["command-line-utilities", "desktop-environment"]
keywords = ["games", "steam", "launcher", "linux", "windows"]

[dependencies]
dirs = "6.0.0"
eframe = { version = "0.36.1", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
    "links",
    "wayland",
    "x11",
] }
egui_extras = { version = "0.36.1", features = ["image", "file"] }
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico", "tiff"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.4.0"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
winreg = { version = "0.54", optional = true }

[features]
default = []
windows = ["winreg"]

[target.'cfg(windows)'.dependencies]
winreg = "0.54"

[[bin]]
name = "launchvault"
path = "src/main.rs"

[profile.release]
lto = true
strip = true
opt-level = 3

# cargo-deb config
[package.metadata.deb]
maintainer = "kik4311 <kik4311@users.noreply.github.com>"
section = "games"
priority = "optional"
depends = ["libwebkit2gtk-4.1-0", "libgtk-3-0", "libayatana-appindicator3-1", "librsvg2-2"]
assets = [
    ["target/release/launchvault", "usr/bin/", "755"],
    { source = "src/launchvault.desktop", dest = "/usr/share/applications/launchvault.desktop" },
    { source = "src/launchvault.svg", dest = "/usr/share/icons/hicolor/scalable/apps/launchvault.svg" },
]

# cargo-generate-rpm config
[package.metadata.generate-rpm]
summary = "Персональный игровой центр для Linux"
license = "GPL-3.0"
group = "Applications/Games"
assets = [
    { source = "target/release/launchvault", dest = "/usr/bin/launchvault", mode = "755" },
    { source = "src/launchvault.desktop", dest = "/usr/share/applications/launchvault.desktop", mode = "644" },
    { source = "src/launchvault.svg", dest = "/usr/share/icons/hicolor/scalable/apps/launchvault.svg", mode = "644" },
]

# cargo-wix config
[package.metadata.wix]
manufacturer = "kik4311"
upgrade_code = "{12345678-1234-1234-1234-123456789012}"
license_file = "LICENSE"
template = "wix/main.wxs"