[package]
name = "launchvault"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "6.0.0"
eframe = { version = "0.36.1", default-features = false, features = [
    "glow",
    "default_fonts",
    "accesskit",
    "links",
    "wayland",
    "x11",
] }
egui_extras = { version = "0.36.1", features = ["image", "file"] }
env_logger = "0.11.11"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico", "tiff"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = "3.4.0"
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.54"
