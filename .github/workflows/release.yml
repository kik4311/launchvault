name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (AppImage, deb, rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-gnu
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Install cargo-deb
        run: cargo install cargo-deb --force
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --force
      - name: Install linuxdeploy
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          chmod +x linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage -O linuxdeploy-plugin-appimage
          chmod +x linuxdeploy-plugin-appimage
      - name: Build
        run: cargo build --release
      - name: Create AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp target/release/launchvault AppDir/usr/bin/
          cat > AppDir/launchvault.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=LaunchVault
          Exec=launchvault
          Icon=launchvault
          Categories=Game;
          EOF
          cat > AppDir/launchvault.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><rect width="256" height="256" rx="32" fill="#2d3447"/><path d="M128 48c-44 0-80 36-80 80s36 80 80 80 80-36 80-80-36-80-80-80zm0 144c-35 0-64-29-64-64s29-64 64-64 64 29 64 64-29 64-64 64z" fill="#4a9eff"/><path d="M128 88c-22 0-40 18-40 40s18 40 40 40 40-18 40-40-18-40-40-40zm0 16c13 0 24 11 24 24s-11 24-24 24-24-11-24-24 11-24 24-24z" fill="#1a1f2e"/></svg>
          EOF
          cp AppDir/launchvault.svg AppDir/launchvault.png 2>/dev/null || true
          ./linuxdeploy --appdir AppDir --output appimage
      - name: Build deb package
        run: cargo deb --no-build --output target/debian
      - name: Build rpm package
        run: cargo generate-rpm
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: launchvault-linux
          path: |
            LaunchVault-*.AppImage
            target/debian/*.deb
            target/generate-rpm/*.rpm

  build-windows-cross:
    name: Build Windows cross (MinGW, exe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 wixl
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-gnu
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-mingw-${{ hashFiles('**/Cargo.lock') }}
      - name: Build (cross-compile)
        run: cargo build --release --target x86_64-pc-windows-gnu
      - name: Build MSI installer
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p target/release
          cp target/x86_64-pc-windows-gnu/release/launchvault.exe target/release/launchvault.exe
          sed "s/Version=\"0.1.0\"/Version=\"$VERSION\"/" wix/main.wxs > target/wix-main.wxs
          wixl target/wix-main.wxs -o target/release/launchvault.msi
      - name: Upload Windows cross artifact
        uses: actions/upload-artifact@v4
        with:
          name: launchvault-windows-cross
          path: |
            target/x86_64-pc-windows-gnu/release/launchvault.exe
            target/release/launchvault.msi

  release:
    name: Create Release
    needs: [build-linux, build-windows-cross]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: launchvault-linux
          path: artifacts/linux
          merge-multiple: true
      - name: Download Windows cross artifacts
        uses: actions/download-artifact@v4
        with:
          name: launchvault-windows-cross
          path: artifacts/windows-cross
          merge-multiple: true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/LaunchVault-*.AppImage
            artifacts/linux/*.deb
            artifacts/linux/*.rpm
            artifacts/windows-cross/launchvault.exe
            artifacts/windows-cross/*.msi
          generate_release_notes: true