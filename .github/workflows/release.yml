name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (AppImage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-unknown-linux-gnu
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release
      - name: Create AppImage
        run: |
          mkdir -p AppDir/usr/bin
          cp target/release/launchvault AppDir/usr/bin/
          cat > AppDir/launchvault.desktop << 'EOF'
          [Desktop Entry]
          Type=Application
          Name=LaunchVault
          Exec=launchvault
          Icon=launchvault
          Categories=Game;
          EOF
          cat > AppDir/launchvault.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256"><rect width="256" height="256" rx="32" fill="#2d3447"/><path d="M128 48c-44 0-80 36-80 80s36 80 80 80 80-36 80-80-36-80-80-80zm0 144c-35 0-64-29-64-64s29-64 64-64 64 29 64 64-29 64-64 64z" fill="#4a9eff"/><path d="M128 88c-22 0-40 18-40 40s18 40 40 40 40-18 40-40-18-40-40-40zm0 16c13 0 24 11 24 24s-11 24-24 24-24-11-24-24 11-24 24-24z" fill="#1a1f2e"/></svg>
          EOF
          cp AppDir/launchvault.svg AppDir/launchvault.png 2>/dev/null || true
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          ./appimagetool AppDir launchvault-x86_64.AppImage
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: launchvault-linux
          path: launchvault-x86_64.AppImage

  build-windows:
    name: Build Windows (exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          target: x86_64-pc-windows-msvc
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        run: cargo build --release
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: launchvault-windows
          path: target/release/launchvault.exe

  release:
    name: Create Release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: launchvault-linux
          path: artifacts/linux
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: launchvault-windows
          path: artifacts/windows
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/linux/launchvault-x86_64.AppImage
            artifacts/windows/launchvault.exe
          generate_release_notes: true