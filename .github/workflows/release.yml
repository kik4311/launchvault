name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libglib2.0-dev \
            libgdk-pixbuf-2.0-dev pkg-config
      - name: Build
        run: cargo build --release
      - name: Install cargo-deb
        run: cargo install cargo-deb
      - name: Create deb
        run: cargo deb --no-build --output target/debian
      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm
      - name: Create rpm
        run: cargo generate-rpm
      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            target/debian/*.deb
            target/generate-rpm/*.rpm
            target/release/launchvault

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >-
            mingw-w64-x86_64-rust
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-libadwaita
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gdk-pixbuf2
            mingw-w64-x86_64-adwaita-icon-theme
            mingw-w64-x86_64-hicolor-icon-theme
            mingw-w64-x86_64-gsettings-desktop-schemas
      - name: Build
        run: cargo build --release
      - name: Collect runtime
        run: |
          set -e
          STAGE=stage
          rm -rf "$STAGE"
          mkdir -p "$STAGE"
          cp target/release/launchvault.exe "$STAGE/"
          copy_deps() {
            local f="$1"
            objdump -p "$f" | grep 'DLL Name' | awk '{print $3}' | while read -r dll; do
              if [ -f "/mingw64/bin/$dll" ] && [ ! -f "$STAGE/$dll" ]; then
                cp "/mingw64/bin/$dll" "$STAGE/"
                copy_deps "$STAGE/$dll"
              fi
            done
          }
          copy_deps target/release/launchvault.exe
          PIXDIR="/mingw64/lib/gdk-pixbuf-2.0/2.10.0/loaders"
          for loader in "$PIXDIR"/*.dll; do
            [ -f "$loader" ] && copy_deps "$loader"
          done
          mkdir -p "$STAGE/share/icons" \
                   "$STAGE/share/glib-2.0/schemas" \
                   "$STAGE/lib/gdk-pixbuf-2.0/2.10.0/loaders"
          cp -r /mingw64/share/icons/Adwaita "$STAGE/share/icons/"
          cp -r /mingw64/share/icons/hicolor "$STAGE/share/icons/"
          cp /mingw64/share/glib-2.0/schemas/gschemas.compiled "$STAGE/share/glib-2.0/schemas/"
          cp "$PIXDIR"/*.dll "$STAGE/lib/gdk-pixbuf-2.0/2.10.0/loaders/"
          if [ -f "/mingw64/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache" ]; then
            cp "/mingw64/lib/gdk-pixbuf-2.0/2.10.0/loaders.cache" "$STAGE/lib/gdk-pixbuf-2.0/2.10.0/"
          fi
          echo "staged files: $(find "$STAGE" -type f | wc -l)"
          du -sh "$STAGE"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches.Groups[1].Value
          $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup*\ISCC.exe" | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found" }
          & $iscc.FullName "/DMyAppVersion=$ver" "installer\launchvault.iss"
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages
          path: installer/output/LaunchVault-Setup.exe

  release:
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist/linux
      - uses: actions/download-artifact@v4
        with:
          name: windows-packages
          path: dist/windows
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/linux/debian/*.deb
            dist/linux/generate-rpm/*.rpm
            dist/linux/release/launchvault
            dist/windows/LaunchVault-Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
